algorithm:
  name: sac
  policy: MultiInputPolicy
  verbose: 1
  seed: 46
  device: cuda
  learning_rate: 0.0002
  ent_coef: auto_0.1
  train_freq: [4, step]
  batch_size: 128
  gradient_steps: 4
  learning_starts: 500
  buffer_size: 50000
  gamma: 0.995
  tau: 0.01
  use_sde_at_warmup: false
  use_sde: false
  net_arch: [256, 256]
  total_timesteps: 3000
  log_interval: 1
  checkpoint_freq: 1000
  wrapper_order: [timelimit]
  timelimit:
    enable: true
    max_episode_steps: 3000

context_manager:
  name: default_awsim_context_manager

action_adapter:
  name: pilotnet_residual_action_adapter
  package_path: /aichallenge/workspace/src/aichallenge_submit/pilot_net_controller/pilot_net_controller
  checkpoint_path: /aichallenge/workspace/src/aichallenge_submit/pilot_net_controller/ckpt/pilotnet_weights.npy
  steering_residual_scale: 0.005
  acceleration_residual_scale: 0.005
  max_speed_mps: 2.0

observation_builder:
  name: default_image_speed_observation_builder

reward:
  name: default_awsim_reward
  speed_reward_scale: 0.5
  step_time_penalty: 0.05
  collision_penalty: 50.0
  section_progress_bonus: 0.0
  lap_completion_bonus: 0.0
  steering_penalty_scale: 0.02
  steering_change_penalty_scale: 0.05
  acceleration_change_penalty_scale: 0.01
  raceline_progress_reward_scale: 0.0
  cross_track_penalty_scale: 0.0

termination:
  name: default_collision_termination
  collision_speed_threshold: 0.2
  collision_count_threshold: 180
  collision_speed_drop_threshold: 1.5
  min_speed_before_drop: 2.0
