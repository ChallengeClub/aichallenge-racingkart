/**:
  ros__parameters:
    log_interval_sec: 5.0        # 推論統計ログを出す間隔（秒）
    
    model:
      input_dim: 750            # LiDARスキャンの入力次元
      output_dim: 2              # 出力（steering, throttleなど）
      architecture: "normal"      # "normal" または "small"
      ckpt_path: "/path/to/tinylidarnet_weights.npy"

    max_range: 30.0              # LiDARの最大レンジ（メートル）
    control_mode: "fixed"          # "ai" または "fixed"
    acceleration: 0.6            # 速度制御を無効化した場合の固定値

    # Use permitted wheel odometry to launch with enough force, then hold a
    # conservative speed.  A fixed low acceleration cannot overcome static
    # friction, while the original 0.6 setting exceeds 5 m/s.
    speed_control:
      enabled: true
      target_speed_mps: 2.5
      proportional_gain: 0.8
      min_acceleration: -0.2
      max_acceleration: 0.6
      adaptive_braking_enabled: true
      hard_braking_threshold_mps: 0.3
      hard_min_acceleration: -0.6
      straight_boost_enabled: true
      straight_speed_mps: 2.75
      max_straight_steering: 0.08
      minimum_straight_clearance_m: 12.0
      # Experimental predictive yield/avoidance remains available but disabled
      # because the NPC E2E stability gate was not met.
      predictive_slowdown_enabled: false
      activation_ttc_sec: 3.0
      minimum_ttc_sec: 1.5
      predictive_minimum_speed_scale: 0.6
      predictive_avoidance_distance_m: 6.0
      predictive_avoidance_max_steering: 0.08
      minimum_closing_speed_mps: 0.5
      ttc_rate_history_size: 3
      ttc_hold_steps: 5
      # A high target is allowed only after a persistently open, nearly straight
      # corridor is confirmed. The pulse ends before the ordinary straight gate.
      straight_burst_enabled: false
      straight_burst_speed_mps: 3.5
      straight_burst_confirmation_updates: 5
      straight_burst_maximum_duration_sec: 2.5
      straight_burst_cooldown_sec: 1.0
      straight_burst_entry_clearance_m: 16.0
      straight_burst_exit_clearance_m: 13.0
      straight_burst_entry_steering: 0.05
      straight_burst_exit_steering: 0.07
      straight_burst_obstacle_distance_m: 12.0

    # Compensate for the LiDAR-only steering policy not observing vehicle speed.
    # The residual is zero at normal speed and bounded during a fast turn-in.
    speed_conditioned_steering:
      enabled: false
      activation_speed_mps: 2.5
      full_effect_speed_mps: 3.5
      proportional_gain: 0.18
      lead_gain: 0.35
      previous_smoothing: 0.7
      minimum_steering: 0.03
      maximum_correction: 0.12

    # Confirm compact obstacles over multiple scans before treating them as an
    # NPC threat.  The adopted v2 also accepts a cluster with one visible edge
    # because an NPC can overlap a wall in a curve.
    npc_tracker:
      enabled: true
      maximum_distance_m: 6.0
      confirmation_hits: 3
      maximum_missed_updates: 2
      association_angle_deg: 10.0
      association_distance_m: 1.5
      minimum_closing_speed_mps: 0.3
      maximum_track_age_sec: 0.5
      minimum_boundary_count: 1
      activation_ttc_sec: 3.0
      minimum_ttc_sec: 1.2
      minimum_speed_scale: 0.35
      # 1.0 is the validated linear response. Values below 1.0 preserve more
      # speed at moderate TTC, but the 0.5 prototype did not pass the 500 s gate.
      speed_scale_exponent: 1.0
      # Relax only when the tracked NPC is already offset from the path and
      # continuing to move laterally away. Head-on and close threats stay linear.
      adaptive_speed_scale_enabled: true
      passing_speed_scale_exponent: 0.75
      minimum_lateral_offset_m: 0.8
      minimum_lateral_separation_speed_mps: 0.2
      adaptive_minimum_distance_m: 2.5
      adaptive_confirmation_updates: 5
      adaptive_maximum_duration_sec: 0.8
      adaptive_cooldown_sec: 1.0
      adaptive_minimum_ttc_sec: 1.8

    # If a vehicle that was already moving stays almost stationary, the close
    # range residual is forced even when a side contact makes the front sector
    # look clear.  Initial launch is excluded until moving speed was observed.
    stuck_recovery:
      enabled: false
      stopped_speed_mps: 0.2
      moving_speed_mps: 0.8
      trigger_duration_sec: 2.0

    # The neural steering remains primary.  This residual acts only when the
    # forward sector is blocked, then holds the open-side turn briefly so that
    # it is not cancelled immediately after the nose starts rotating.
    lidar_safety:
      enabled: true
      activation_distance_m: 4.0
      stop_distance_m: 0.5
      max_steering_correction: 0.6
      minimum_speed_scale: 0.5
      minimum_steering_correction: 0.35
      recovery_hold_steps: 6

    debug: false
