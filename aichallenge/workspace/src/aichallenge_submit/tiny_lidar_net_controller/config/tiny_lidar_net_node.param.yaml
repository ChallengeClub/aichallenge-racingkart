/**:
  ros__parameters:
    log_interval_sec: 5.0        # 推論統計ログを出す間隔（秒）
    
    model:
      input_dim: 750            # LiDARスキャンの入力次元
      output_dim: 2              # 出力（steering, throttleなど）
      architecture: "normal"      # "normal" または "small"
      ckpt_path: "/path/to/tinylidarnet_weights.npy"

    max_range: 30.0              # LiDARの最大レンジ（メートル）
    control_mode: "fixed"          # "ai" または "fixed"
    acceleration: 0.6            # 速度制御を無効化した場合の固定値

    # Use permitted wheel odometry to launch with enough force, then hold a
    # conservative speed.  A fixed low acceleration cannot overcome static
    # friction, while the original 0.6 setting exceeds 5 m/s.
    speed_control:
      enabled: true
      target_speed_mps: 2.5
      proportional_gain: 0.8
      min_acceleration: -0.2
      max_acceleration: 0.6
      straight_boost_enabled: true
      straight_speed_mps: 2.75
      max_straight_steering: 0.08
      minimum_straight_clearance_m: 12.0

    # The neural steering remains primary.  This residual acts only when the
    # forward sector is blocked, then holds the open-side turn briefly so that
    # it is not cancelled immediately after the nose starts rotating.
    lidar_safety:
      enabled: true
      activation_distance_m: 4.0
      stop_distance_m: 0.5
      max_steering_correction: 0.6
      minimum_speed_scale: 0.5
      minimum_steering_correction: 0.35
      recovery_hold_steps: 6

    debug: false
